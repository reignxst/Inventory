<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Supply Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="glow"></div>
<div id="splash"><span>AUTO SUPPLY</span></div>
<div class="app">
  <aside class="side">
    <div class="logo">AUTO SUPPLY</div>
    <nav>
      <button class="nv on" data-a="go" data-v="dash"><i>◫</i>Dashboard</button>
      <button class="nv" data-a="go" data-v="inv"><i>▤</i>Inventory</button>
      <button class="nv" data-a="go" data-v="cal"><i>▦</i>Calendar</button>
      <button class="nv" data-a="go" data-v="ana"><i>◔</i>Analytics</button>
      <button class="nv" data-a="go" data-v="rep"><i>⎙</i>Reports</button>
      <button class="nv" data-a="go" data-v="trash"><i>🗑️</i>Trash<b id="tb"></b></button>
    </nav>
    <button class="nv reset" data-a="reset" title="Reset demo data"><i>↺</i>Reset</button>
  </aside>
  <main>
    <header class="top">
      <h1>Overview</h1>
      <label class="search"><span>⌕</span><input id="q" placeholder="Search parts, SKU, brand, category…"></label>
      <div class="clock" id="clock"></div>
      <button class="bell" data-a="bell" aria-label="Notifications">🔔<b id="nb"></b></button>
      <div class="av">A</div>
    </header>
    <section id="dash" class="view on"></section>
    <section id="inv" class="view"></section>
    <section id="cal" class="view"></section>
    <section id="ana" class="view"></section>
    <section id="rep" class="view"></section>
    <section id="trash" class="view"></section>
  </main>
</div>
<input type="file" id="rs" accept=".json" hidden><div id="printarea"></div><div id="notif"></div><div id="modal"></div><div id="toast"></div>
<script>
/* ---------- helpers & data ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const P=n=>'₱'+Number(n).toLocaleString('en-PH',{maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const d0=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const sum=(a,k)=>a.reduce((t,x)=>t+x[k],0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const lowOf=i=>+i.min>0&&i.qty<=i.min; /* alert only when YOU set an alert level and stock reached it */
const CATS={'Motor Parts':'⚙️','Car Parts':'🚗','Engine Oil & Fluids':'🛢️','Tires & Wheels':'🛞','Brakes':'🛑','Batteries & Electrical':'🔋','Filters':'🌀','Lighting':'💡','Accessories':'✨','Tools':'🔧','Others':'📦'};
const COL=['#b08d4f','#4d7c4a','#c9a9a0','#6f6a5c','#d8c49a','#8aa27e','#a5654f','#9a8f7a','#cbbf9f','#7b8fa1','#a39060'];
const TITLES={dash:'Overview',inv:'Inventory',cal:'Calendar',ana:'Analytics',rep:'Reports',trash:'Trash'};
function seed(){
  const it=[['Brake Pad Set (Front)','Brakes',14,450,850,'Brembo'],['Drive Chain 428','Motor Parts',10,380,650,'DID'],['Engine Oil 10W-40 1L','Engine Oil & Fluids',40,260,420,'Castrol'],['Spark Plug','Motor Parts',50,85,160,'NGK'],['Car Battery 55D23L','Batteries & Electrical',4,3200,4500,'Motolite'],['Oil Filter','Filters',20,120,250,'Bosch'],['Tire 80/90-14','Tires & Wheels',6,1100,1650,'Michelin'],['LED Headlight Bulb H4','Lighting',12,550,990,'Philips'],['Radiator Coolant 1L','Engine Oil & Fluids',18,150,280,'Prestone'],['Wrench Set 10pcs','Tools',7,700,1250,'Stanley']]
   .map((a,i)=>({id:uid(),sku:'AS-'+(100+i),name:a[0],cat:a[1],qty:a[2],cost:a[3],price:a[4],brand:a[5],min:5,supplier:'',exp:'',note:''}));
  const sales=[];for(let i=0;i<22;i++){const x=it[i*3%it.length],q=1+i%3;sales.push({id:uid(),iid:x.id,name:x.name,qty:q,amt:x.price*q,cost:x.cost*q,cat:x.cat,date:d0(-(i%7)),st:['Paid','Shipped','Processing'][i%3]})}
  return{items:it,trash:[],sales,events:[{id:uid(),date:d0(2),title:'Supplier delivery',type:'Delivery'},{id:uid(),date:d0(5),title:'Restock bags',type:'Restock'}]};
}
let S=JSON.parse(localStorage.getItem('autosupply-inv')||'null')||seed();
const save=()=>localStorage.setItem('autosupply-inv',JSON.stringify(S));
let V='dash',Q='',F='All',CM=new Date();CM.setDate(1);

/* ---------- ui primitives ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function modal(title,fields,v,ok){
  const m=$('#modal');
  m.innerHTML=`<form class="mbox"><h3>${title}</h3><div class="fg">${fields.map(f=>`<label class="${f.w||''}">${f.l}${f.t=='select'?`<select name="${f.n}">${f.o.map(o=>`<option ${o==v[f.n]?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" value="${esc(v[f.n])}" ${f.r?'required':''} ${f.t=='number'?`step="${f.s||'any'}" min="0"`:''}>`}</label>`).join('')}</div><div class="acts"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn">Save</button></div></form>`;
  m.classList.add('on');setTimeout(()=>$('input,select',m)?.focus(),200);
  $('form',m).onsubmit=e=>{e.preventDefault();if(ok(Object.fromEntries(new FormData(e.target)))!==false)m.classList.remove('on')};
}
const closeM=()=>$('#modal').classList.remove('on');
function ask(h,msg,btn,cb){const m=$('#modal');m.innerHTML=`<div class="mbox" style="width:min(420px,92vw)"><h3>${h}</h3><p style="margin-top:4px">${msg}</p><div class="acts"><button type="button" class="btn ghost" data-x>Cancel</button><button type="button" class="btn danger" id="yes">${btn}</button></div></div>`;m.classList.add('on');$('#yes').onclick=()=>{m.classList.remove('on');cb()};setTimeout(()=>$('#yes')?.focus(),150)}
function pie(id,data){
  const tot=sum(data,'v')||1,R=40,C=2*Math.PI*R;let off=0;
  $(id).innerHTML=`<div class="pie"><svg viewBox="0 0 160 160"><g transform="rotate(-90 80 80)">${data.map(d=>{const l=d.v/tot*C,s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${d.c}" stroke-width="80" stroke-dasharray="0 ${C}" data-l="${l}" style="stroke-dashoffset:${-off}"><title>${d.n}: ${P(d.v)}</title></circle>`;off+=l;return s}).join('')}</g></svg><ul>${data.map(d=>`<li><i style="background:${d.c}"></i>${d.n}<span>${P(d.v)}</span></li>`).join('')}</ul></div>`;
  setTimeout(()=>$$(id+' circle').forEach(c=>c.style.strokeDasharray=`${Math.max(c.dataset.l-1.5,0)} ${C}`),80);
}
function countUp(el){
  const to=+el.dataset.c,m=el.dataset.m,t0=performance.now();
  (function f(t){const k=Math.min((t-t0)/1200,1),e=1-Math.pow(1-k,4),v=to*e;el.textContent=m?P(v):Math.round(v);if(k<1)requestAnimationFrame(f)})(t0);
}
const emoji=c=>CATS[c]||'📦';
const tile=i=>{const h=[...i.name].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `style="--c1:hsl(${h} 30% 88%);--c2:hsl(${(h+30)%360} 28% 76%)"`};

/* ---------- views ---------- */
function money(){
  const rev=sum(S.sales,'amt'),cogs=sum(S.sales,'cost'),stock=S.items.reduce((a,i)=>a+i.qty*i.cost,0);
  return{rev,cogs,stock,prof:rev-cogs,capital:cogs+stock};
}
const earnPie=()=>{const m=money();return[{n:'Profit (kita)',v:Math.max(m.prof,0),c:'#4d7c4a'},{n:'Cost of items sold',v:m.cogs,c:'#b08d4f'},{n:'Capital in unsold stock',v:m.stock,c:'#cbbf9f'}]};
function vDash(){
  const m=money(),low=S.items.filter(lowOf);
  const best=Object.entries(S.sales.reduce((a,s)=>(a[s.iid]=(a[s.iid]||0)+s.qty,a),{})).map(([id,q])=>[S.items.find(i=>i.id==id),q]).filter(x=>x[0]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const days=[...Array(7)].map((_,i)=>d0(i-6)),vals=days.map(d=>S.sales.filter(s=>s.date==d).reduce((a,s)=>a+s.amt,0)),mx=Math.max(...vals,1);
  const pts=vals.map((v,i)=>[20+i*(400/6),120-v/mx*95]);
  let d=`M${pts[0]}`;for(let i=1;i<7;i++){const cx=(pts[i-1][0]+pts[i][0])/2;d+=` C${cx},${pts[i-1][1]} ${cx},${pts[i][1]} ${pts[i]}`}
  const recent=[...S.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  $('#dash').innerHTML=`<div class="dash"><div class="col">
  <div class="wel card" style="padding:14px 20px"><div class="av">A</div><div><h2 id="greet">${greet()}, Amelia!</h2><small>Auto Supply Store · ${S.items.length} products in store</small></div></div>
  <div class="row2"><div class="stats">
    <div class="card b1 tilt"><small>Total Sales</small><h2 data-c="${m.rev}" data-m="1">0</h2><em>▲ ${S.sales.length} orders</em></div>
    <div class="card b2 tilt"><small>Profit</small><h2 data-c="${m.prof}" data-m="1">0</h2><em>▲ ${m.rev?Math.round(m.prof/m.rev*100):0}% margin</em></div>
    <div class="card b3 tilt"><small>Products</small><h2 data-c="${S.items.length}">0</h2><em>${sum(S.items,'qty')} pcs in stock</em></div>
    <div class="card b4 tilt"><small>Low Stock</small><h2 data-c="${low.length}">0</h2><em style="color:var(--red)">needs restock</em></div></div>
  <div class="card best tilt"><h3>Best-Selling Products</h3>${best.map(([i,q])=>`<div class="prod"><div class="pt" ${tile(i)}>${emoji(i.cat)}</div><b>${esc(i.name)}</b><small>${P(i.price)}</small><small>Sold ${q}</small></div>`).join('')||'<p class="empty" style="grid-column:1/-1">No sales yet</p>'}</div></div>
  <div class="row3"><div class="card trend"><h3>Weekly Trend</h3><svg viewBox="0 0 440 160"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08d4f" stop-opacity=".35"/><stop offset="1" stop-color="#b08d4f" stop-opacity="0"/></linearGradient></defs><path class="a" d="${d} L420,125 L20,125Z"/><path class="l" pathLength="1" d="${d}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"><title>${P(vals[i])}</title></circle><text x="${p[0]}" y="148" text-anchor="middle">${new Date(days[i]+'T00:00').toLocaleDateString('en',{weekday:'short'})}</text>`).join('')}</svg></div>
  <div class="card"><h3>Recent Orders</h3><table>${recent.map(s=>`<tr><td>${esc(s.name)}<br><small>${s.qty} pc · ${P(s.amt)}</small></td><td class="ra"><span class="tag ${s.st}">${s.st}</span></td></tr>`).join('')}</table></div></div>
  </div><div class="col">
   <div class="card tilt"><h3>Earnings Summary</h3><div id="p1"></div></div>
   <div class="card"><h3>Low Stock Alerts</h3>${low.map(i=>`<div class="low"><span>${emoji(i.cat)} ${esc(i.name)}</span><span class="tag warn">${i.qty?i.qty+' left':'Out of stock'}</span></div>`).join('')||'<p class="mut">All stocked up ✨</p>'}</div>
  </div></div>`;
  pie('#p1',earnPie());
}
function vInv(){prune('inv',S.items.map(i=>i.id));
  const q=Q.toLowerCase(),rows=S.items.filter(i=>(F=='All'||i.cat==F)&&(!q||[i.name,i.sku,i.cat,i.brand,i.supplier,i.note].join(' ').toLowerCase().includes(q)));
  $('#inv').innerHTML=`<div class="bar"><select id="fc"><option>All</option>${Object.keys(CATS).map(c=>`<option ${c==F?'selected':''}>${c}</option>`).join('')}</select><span class="mut">${rows.length} items · stock value ${P(S.items.reduce((a,i)=>a+i.qty*i.cost,0))}</span><span class="sp"></span>${SEL.inv.size?`<button class="btn danger" data-a="invsel">🗑️ Move ${SEL.inv.size} to trash</button>`:''}<button class="btn ghost" data-a="pinv">🖨 Print</button><button class="btn" data-a="add">＋ Add item</button></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>${ckall('inv',rows.map(i=>i.id))}</th><th>Product</th><th>Category</th><th>Qty</th><th>Cost (puhunan)</th><th>Price</th><th>Margin</th><th>Expiry / Warranty</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr data-id="${i.id}"><td>${ckb('inv',i.id)}</td><td><span class="th">${emoji(i.cat)}</span><span class="pn"><b>${esc(i.name)}</b><small>${esc(i.sku)}${i.brand?' · '+esc(i.brand):''}${i.note?' · '+esc(i.note):''}</small></span></td><td>${i.cat}</td><td><span class="tag ${lowOf(i)?'warn':''}">${i.qty}</span></td><td>${P(i.cost)}</td><td>${P(i.price)}</td><td>${i.cost?Math.round((i.price-i.cost)/i.cost*100):0}%</td><td>${i.exp||'—'}</td><td class="ra"><button class="ib" title="Restock (add quantity)" data-a="stock">＋</button><button class="ib" title="Sell" data-a="sell">₱</button><button class="ib" title="Edit" data-a="edit">✎</button><button class="ib d" title="Move to trash" data-a="del">🗑️</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Nothing here yet. Add your first item.</td></tr>`}</tbody></table></div>`;
}
function vCal(){
  const y=CM.getFullYear(),m=CM.getMonth(),first=CM.getDay(),n=new Date(y,m+1,0).getDate(),td=d0(0);
  const ev=d=>[...S.events.filter(e=>e.date==d).map(e=>({t:e.title,k:e.type})),...S.items.filter(i=>i.exp==d).map(i=>({t:'Expires: '+i.name,k:'Expiry'}))];
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${ds==td?'td':''}" data-a="addev" data-d="${ds}"><b>${d}</b>${ev(ds).map(e=>`<span class="ch ${e.k}">${esc(e.t)}</span>`).join('')}</button>`}
  const up=[...S.events].sort((a,b)=>a.date.localeCompare(b.date));
  $('#cal').innerHTML=`<div class="card"><div class="calh"><h3>${CM.toLocaleDateString('en',{month:'long',year:'numeric'})}</h3><button class="ib" data-a="pm">‹</button><button class="ib" data-a="nm">›</button><button class="btn" data-a="addev" data-d="${td}">＋ Event</button></div><div class="cg">${'Sun Mon Tue Wed Thu Fri Sat'.split(' ').map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>
  <div class="card" style="margin-top:18px"><h3>Scheduled</h3>${up.map(e=>`<div class="low"><span><span class="ch ${e.type}" style="display:inline">${e.type}</span> ${esc(e.title)} · <small>${e.date}</small></span><span><button class="ib" data-a="editev" data-id="${e.id}" title="Edit">✎</button><button class="ib d" data-a="delev" data-id="${e.id}" title="Delete">✕</button></span></div>`).join('')||'<p class="mut">No events. Click a day to add one.</p>'}</div>`;
}
function vAna(){
  const m=money(),cat={};S.items.forEach(i=>cat[i.cat]=(cat[i.cat]||0)+i.qty*i.cost);S.sales.forEach(s=>{const c=s.cat||(S.items.concat(S.trash).find(i=>i.id==s.iid)||{}).cat||'Others';cat[c]=(cat[c]||0)+s.cost});
  $('#ana').innerHTML=`<div class="kpis"><div class="card tilt"><small>Total puhunan (capital)</small><h2 data-c="${m.capital}" data-m="1">0</h2><small>cost of items sold + stock on hand</small></div><div class="card tilt"><small>Total sales</small><h2 data-c="${m.rev}" data-m="1">0</h2></div><div class="card tilt"><small>Profit (kita)</small><h2 data-c="${m.prof}" data-m="1">0</h2></div><div class="card tilt"><small>Profit margin</small><h2>${m.rev?Math.round(m.prof/m.rev*1000)/10:0}%</h2><small>profit ÷ total sales</small></div></div>
  <div class="g2"><div class="card tilt"><h3>Earnings vs. Capital</h3><div id="p2"></div></div><div class="card tilt"><h3>Puhunan by Category</h3><div id="p3"></div></div></div>`;
  pie('#p2',earnPie());pie('#p3',Object.entries(cat).map(([n,v],i)=>({n,v,c:COL[i%COL.length]})));
}
function vTrash(){prune('trash',S.trash.map(i=>i.id));const n=SEL.trash.size;
  $('#trash').innerHTML=`<div class="bar" style="flex-wrap:wrap"><span class="mut">${n?n+' selected':'Tick items to restore or delete several at once.'}</span><span class="sp"></span>${n?`<button class="btn ghost" data-a="trsel">↩ Restore ${n}</button><button class="btn danger" data-a="tdsel">🗑️ Delete ${n} forever</button>`:''}${S.trash.length?'<button class="btn ghost" data-a="empty">Empty trash</button>':''}</div><div class="card"><table><thead><tr><th>${ckall('trash',S.trash.map(i=>i.id))}</th><th>Item</th><th></th></tr></thead><tbody>${S.trash.map(i=>`<tr data-id="${i.id}"><td>${ckb('trash',i.id)}</td><td><span class="th">${emoji(i.cat)}</span><span class="pn"><b>${esc(i.name)}</b><small>${esc(i.sku)} · ${i.qty} pcs</small></span></td><td class="ra"><button class="btn ghost" data-a="restore">Restore</button> <button class="ib d" title="Delete forever" data-a="purge">✕</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Trash is empty.</td></tr>'}</tbody></table></div>`;
}
/* ---------- reports, print & backup ---------- */
let RF=d0(-30),RT=d0(0);
const salesIn=()=>S.sales.filter(s=>s.date>=RF&&s.date<=RT).sort((a,b)=>b.date.localeCompare(a.date));
const csv=r=>'\ufeff'+r.map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printDoc(title,html){$('#printarea').innerHTML=`<h1>AUTO &amp; CO.</h1><h2>${title}</h2><p>Printed ${new Date().toLocaleString()}</p>${html}`;window.print()}
window.addEventListener('afterprint',()=>$('#printarea').innerHTML='');
const salesTbl=(ss,act)=>`<table><thead><tr>${act?`<th>${ckall('sales',ss.map(s=>s.id))}</th>`:''}<th>Date</th><th>Item</th><th>Qty</th><th>Sales</th><th>Cost</th><th>Profit</th><th>Status</th>${act?'<th></th>':''}</tr></thead><tbody>${ss.map(s=>`<tr>${act?`<td>${ckb('sales',s.id)}</td>`:''}<td>${s.date}</td><td>${esc(s.name)}</td><td>${s.qty}</td><td>${P(s.amt)}</td><td>${P(s.cost)}</td><td>${P(s.amt-s.cost)}</td><td>${s.st}</td>${act?`<td class="ra"><button class="ib d" data-a="voids" data-id="${s.id}" title="Delete sale">✕</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${act?9:7}">No sales in this period.</td></tr>`}<tr>${act?'<th></th>':''}<th colspan="2">Total</th><th>${sum(ss,'qty')}</th><th>${P(sum(ss,'amt'))}</th><th>${P(sum(ss,'cost'))}</th><th>${P(sum(ss,'amt')-sum(ss,'cost'))}</th><th></th>${act?'<th></th>':''}</tr></tbody></table>`;
const invTbl=()=>`<table><thead><tr><th>SKU</th><th>Item</th><th>Category</th><th>Brand</th><th>Qty</th><th>Cost</th><th>Price</th><th>Stock value</th></tr></thead><tbody>${S.items.map(i=>`<tr><td>${esc(i.sku)}</td><td>${esc(i.name)}${i.note?'<br><small>'+esc(i.note)+'</small>':''}</td><td>${i.cat}</td><td>${esc(i.brand)}</td><td>${i.qty}</td><td>${P(i.cost)}</td><td>${P(i.price)}</td><td>${P(i.qty*i.cost)}</td></tr>`).join('')}<tr><th colspan="4">Total</th><th>${sum(S.items,'qty')}</th><th colspan="2"></th><th>${P(S.items.reduce((a,i)=>a+i.qty*i.cost,0))}</th></tr></tbody></table>`;
function vRep(){prune('sales',salesIn().map(s=>s.id));
  const ss=salesIn(),lb=+localStorage.getItem('autosupply-backup')||0,days=lb?Math.floor((Date.now()-lb)/864e5):null,old=days===null||days>=7;
  $('#rep').innerHTML=`<div class="g2"><div class="card"><h3>Backup &amp; Restore</h3><p class="mut" style="margin-bottom:12px">Your data is saved only in this browser. If you clear browsing data or switch computers, it will be gone. Download a backup regularly and keep the file somewhere safe (flash drive, email, Google Drive).</p><p style="margin-bottom:14px"><span class="tag ${old?'warn':''}">${lb?'Last backup: '+(days?days+' day(s) ago':'today'):'No backup yet'}</span></p><div class="acts" style="justify-content:flex-start;flex-wrap:wrap;margin:0"><button class="btn" data-a="bk">⬇ Download backup</button><button class="btn ghost" data-a="pickrs">⬆ Restore backup</button></div></div>
  <div class="card"><h3>Print &amp; Export</h3><p class="mut" style="margin-bottom:14px">Print a paper or PDF copy of your stock, or export to Excel (CSV).</p><div class="acts" style="justify-content:flex-start;flex-wrap:wrap;margin:0"><button class="btn" data-a="pinv">🖨 Print inventory</button><button class="btn ghost" data-a="csvi">Inventory CSV</button></div></div></div>
  <div class="card" style="margin-top:18px;overflow-x:auto"><div class="bar" style="flex-wrap:wrap"><h3 style="margin:0">Sales Report</h3><span class="sp"></span><label class="mut">From <input type="date" id="rf" value="${RF}"></label><label class="mut">To <input type="date" id="rt" value="${RT}"></label>${SEL.sales.size?`<button class="btn danger" data-a="vsel">🗑️ Delete ${SEL.sales.size} selected</button>`:''}<button class="btn" data-a="psales">🖨 Print</button><button class="btn ghost" data-a="csvs">CSV</button></div>${salesTbl(ss,1)}</div>`;
}
document.addEventListener('change',e=>{if(e.target.id=='rf'&&e.target.value){RF=e.target.value;render()}if(e.target.id=='rt'&&e.target.value){RT=e.target.value;render()}});
$('#rs').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!Array.isArray(d.sales))throw 0;ask('Restore this backup?',`It will replace your current data with the backup (${d.items.length} items, ${d.sales.length} sales).`,'Restore',()=>{S={trash:[],events:[],...d};save();render();toast('Backup restored')})}catch{toast('Invalid backup file')}};r.readAsText(f)});
/* ---------- notifications ---------- */
const txt=x=>{const d=document.createElement('div');d.innerHTML=x;return d.textContent};
const getSeen=()=>new Set(JSON.parse(localStorage.getItem('autosupply-seen')||'[]'));
let ready=false,lastUn=0;
function notifs(){
  const t=d0(0),tm=d0(1),o=[],lb=+localStorage.getItem('autosupply-backup')||0;
  S.events.forEach(e=>{
    if(e.date==t)o.push({k:`ev:${e.id}:t`,ic:'🔔',h:`Today: ${esc(e.title)}`,s:`${esc(e.type)} · happening today`,v:'cal'});
    else if(e.date==tm)o.push({k:`ev:${e.id}:m`,ic:'⏰',h:`Tomorrow: ${esc(e.title)}`,s:`${esc(e.type)} · ${e.date}`,v:'cal'});
  });
  S.items.forEach(i=>{
    if(i.exp==t)o.push({k:`ex:${i.id}:t`,ic:'⚠️',h:`Expires today: ${esc(i.name)}`,s:'Check the expiry / warranty date',v:'inv'});
    else if(i.exp==tm)o.push({k:`ex:${i.id}:m`,ic:'⚠️',h:`Expires tomorrow: ${esc(i.name)}`,s:i.exp,v:'inv'});
    if(lowOf(i))o.push({k:`low:${i.id}:${i.qty}`,ic:'📉',h:i.qty?`Low stock: ${esc(i.name)}`:`Out of stock: ${esc(i.name)}`,s:`${i.qty} left · your alert level is ${i.min}`,v:'inv'});
  });
  if(S.sales.length&&Date.now()-lb>6048e5)o.push({k:'bk:'+t,ic:'💾',h:'Back up your data',s:lb?'No backup in over 7 days':'You have no backup yet',v:'rep'});
  return o;
}
function drawNotif(n,sn){$('#notif').innerHTML=`<h3>Notifications</h3>${n.map(x=>`<button class="nt ${sn.has(x.k)?'':'new'}" data-a="go" data-v="${x.v}"><span>${x.ic}</span><span><b>${x.h}</b><small>${x.s}</small></span></button>`).join('')||'<p class="empty">You are all caught up ✨</p>'}`}
function notifUI(){const n=notifs(),sn=getSeen(),un=n.filter(x=>!sn.has(x.k));$('#nb').textContent=un.length||'';if($('#notif').classList.contains('on'))drawNotif(n,sn);return un}
function announce(){const un=notifUI();if(ready){if(un.length>lastUn)toast('🔔 '+(un.length==1?txt(un[0].h):un.length+' new notifications'));lastUn=un.length}}
const EVF=[{n:'title',l:'Title (e.g. Delivery of tires)',w:'w',r:1},{n:'date',l:'Date',t:'date',r:1},{n:'type',l:'Type',t:'select',o:['Restock','Delivery','Payment','Other']}];
/* ---------- multi-select ---------- */
const SEL={inv:new Set(),trash:new Set(),sales:new Set()};
const prune=(k,ids)=>{const s=new Set(ids);[...SEL[k]].forEach(x=>s.has(x)||SEL[k].delete(x))};
const ckb=(k,id)=>`<input type="checkbox" class="ck" data-k="${k}" data-id="${id}" ${SEL[k].has(id)?'checked':''} aria-label="Select">`;
const ckall=(k,ids)=>`<input type="checkbox" class="ckall" data-k="${k}" ${ids.length&&ids.every(x=>SEL[k].has(x))?'checked':''} aria-label="Select all">`;
document.addEventListener('change',e=>{const t=e.target,k=t.dataset?.k;if(!k)return;const s=SEL[k];
  if(t.matches('.ck')){t.checked?s.add(t.dataset.id):s.delete(t.dataset.id);render()}
  else if(t.matches('.ckall')){$$(`.ck[data-k="${k}"]`).forEach(c=>t.checked?s.add(c.dataset.id):s.delete(c.dataset.id));render()}});
const VIEWS={dash:vDash,inv:vInv,cal:vCal,ana:vAna,rep:vRep,trash:vTrash};
function render(){VIEWS[V]();$('#tb').textContent=S.trash.length||'';announce();$$('.view.on .card').forEach((c,i)=>c.style.setProperty('--i',i));$$('.view.on [data-c]').forEach(countUp)}
function go(v){V=v;$$('.view').forEach(e=>{e.classList.toggle('on',e.id==v);e.classList.remove('enter')});$$('.nv[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('h1').textContent=TITLES[v];const el=$('#'+v);el.classList.add('enter');setTimeout(()=>el.classList.remove('enter'),1400);render()}

/* ---------- actions ---------- */
const FIELDS=[{n:'name',l:'Product name',w:'w',r:1},{n:'sku',l:'SKU / code'},{n:'cat',l:'Category',t:'select',o:Object.keys(CATS)},{n:'qty',l:'Quantity in stock',t:'number',s:1,r:1},{n:'min',l:'Alert me when stock is at or below (0 = no alert)',t:'number',s:1},{n:'cost',l:'Cost / puhunan (₱)',t:'number',r:1},{n:'price',l:'Selling price (₱)',t:'number',r:1},{n:'brand',l:'Brand'},{n:'supplier',l:'Supplier'},{n:'exp',l:'Expiry / warranty until',t:'date'},{n:'note',l:'Fits / compatible vehicle (e.g. Honda Click 125, Toyota Vios 2015)',w:'w'}];
const num=o=>{o.name=(o.name||'').trim();['qty','min'].forEach(k=>o[k]=Math.max(0,Math.floor(+o[k]||0)));['cost','price'].forEach(k=>o[k]=Math.max(0,Math.round((+o[k]||0)*100)/100));return o};
const find=el=>S.items.find(i=>i.id==el.closest('tr')?.dataset.id);
const ACT={
  go:b=>go(b.dataset.v),
  add:()=>modal('Add item',FIELDS,{sku:'AS-'+(100+S.items.length+S.trash.length),qty:1,min:''},d=>{const n=num(d);if(!n.name)return toast('Item name is required')||false;S.items.unshift({id:uid(),...n});save();render();toast('Item added')}),
  edit:b=>{const i=find(b);modal('Edit item',FIELDS,i,d=>{const n=num(d);if(!n.name)return toast('Item name is required')||false;Object.assign(i,n);save();render();toast('Changes saved')})},
  stock:b=>{const i=find(b);modal(`Restock · ${esc(i.name)}`,[{n:'qty',l:`Add quantity (now ${i.qty} in stock)`,t:'number',s:1,r:1}],{qty:''},d=>{const q=+d.qty;if(!Number.isInteger(q)||q<1)return toast('Enter a whole number, 1 or more')||false;i.qty+=q;save();render();toast(`Added ${q} · now ${i.qty} in stock`)})},
  sell:b=>{const i=find(b);if(i.qty<1)return toast('Out of stock. Restock it first.');modal(`Sell · ${esc(i.name)}`,[{n:'qty',l:`Quantity (${i.qty} available)`,t:'number',s:1,r:1},{n:'price',l:'Price each (₱)',t:'number',r:1}],{qty:1,price:i.price},d=>{const q=+d.qty,p=+d.price;if(!Number.isInteger(q)||q<1)return toast('Enter a whole number, 1 or more')||false;if(q>i.qty)return toast(`Only ${i.qty} in stock`)||false;i.qty-=q;S.sales.push({id:uid(),iid:i.id,name:i.name,cat:i.cat,qty:q,amt:Math.round(q*p*100)/100,cost:Math.round(q*i.cost*100)/100,date:d0(0),st:'Paid'});save();render();toast(`Sold ${q} · ${P(q*p)}`)})},
  del:b=>{const tr=b.closest('tr'),i=find(b);ask('Move to trash?',`<b>${esc(i.name)}</b> will be moved to Trash. You can restore it anytime.`,'Move to trash',()=>{tr.classList.add('out');setTimeout(()=>{S.items=S.items.filter(x=>x!==i);S.trash.unshift(i);save();render();toast('Moved to trash')},350)})},
  restore:b=>{const i=S.trash.find(x=>x.id==b.closest('tr').dataset.id);S.trash=S.trash.filter(x=>x!==i);S.items.unshift(i);save();render();toast('Item restored')},
  purge:b=>{const id=b.closest('tr').dataset.id,i=S.trash.find(x=>x.id==id);ask('Delete forever?',`<b>${esc(i.name)}</b> will be permanently deleted. This cannot be undone.`,'Delete forever',()=>{S.trash=S.trash.filter(x=>x.id!=id);SEL.trash.delete(id);save();render();toast('Deleted permanently')})},
  empty:()=>ask('Empty the trash?',`${S.trash.length} item(s) will be permanently deleted. This cannot be undone.`,'Empty trash',()=>{S.trash=[];SEL.trash.clear();save();render();toast('Trash emptied')}),
  pm:()=>{CM.setMonth(CM.getMonth()-1);render()},nm:()=>{CM.setMonth(CM.getMonth()+1);render()},
  addev:b=>modal('Add event',EVF,{date:b.dataset.d,type:'Delivery'},d=>{d.title=d.title.trim();if(!d.title||!d.date)return toast('Title and date are required')||false;S.events.push({id:uid(),...d});save();render();toast('Event added')}),
  editev:b=>{const e=S.events.find(x=>x.id==b.dataset.id);modal('Edit event',EVF,e,d=>{d.title=d.title.trim();if(!d.title||!d.date)return toast('Title and date are required')||false;Object.assign(e,d);save();render();toast('Event updated')})},
  delev:b=>{const e=S.events.find(x=>x.id==b.dataset.id);ask('Delete this event?',`<b>${esc(e.title)}</b> on ${e.date} will be removed from your calendar.`,'Delete event',()=>{S.events=S.events.filter(x=>x!==e);save();render();toast('Event deleted')})},
  voids:b=>{const s=S.sales.find(x=>x.id==b.dataset.id);ask('Delete this sale?',`${s.qty} × <b>${esc(s.name)}</b> (${P(s.amt)}) will be removed from your sales and totals.<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" id="rtn" class="plain" checked> Return the items to stock (uncheck if you are only clearing old records)</label>`,'Delete sale',()=>{if($('#rtn').checked){const it=S.items.concat(S.trash).find(i=>i.id==s.iid);if(it)it.qty+=s.qty}S.sales=S.sales.filter(x=>x!==s);SEL.sales.delete(s.id);save();render();toast('Sale deleted')})},
  vsel:()=>{const ids=[...SEL.sales],ss=S.sales.filter(s=>ids.includes(s.id));ask('Delete selected sales?',`${ss.length} sale(s) worth ${P(sum(ss,'amt'))} will be removed from your sales and totals.<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" id="rtn" class="plain" checked> Return the items to stock (uncheck if you are only clearing old records)</label>`,'Delete sales',()=>{const back=$('#rtn').checked;ss.forEach(s=>{if(back){const it=S.items.concat(S.trash).find(i=>i.id==s.iid);if(it)it.qty+=s.qty}});S.sales=S.sales.filter(s=>!ids.includes(s.id));SEL.sales.clear();save();render();toast(`${ss.length} sale(s) deleted`)})},
  invsel:()=>{const ids=[...SEL.inv];ask('Move to trash?',`${ids.length} selected item(s) will be moved to Trash. You can restore them anytime.`,'Move to trash',()=>{const mv=S.items.filter(i=>ids.includes(i.id));S.items=S.items.filter(i=>!ids.includes(i.id));S.trash.unshift(...mv);SEL.inv.clear();save();render();toast(`${mv.length} item(s) moved to trash`)})},
  trsel:()=>{const ids=[...SEL.trash],mv=S.trash.filter(i=>ids.includes(i.id));S.trash=S.trash.filter(i=>!ids.includes(i.id));S.items.unshift(...mv);SEL.trash.clear();save();render();toast(`${mv.length} item(s) restored`)},
  tdsel:()=>{const ids=[...SEL.trash];ask('Delete forever?',`${ids.length} selected item(s) will be permanently deleted. This cannot be undone.`,'Delete forever',()=>{S.trash=S.trash.filter(i=>!ids.includes(i.id));SEL.trash.clear();save();render();toast('Deleted permanently')})},
  bell:()=>{const p=$('#notif');if(p.classList.contains('on')){p.classList.remove('on');return}const n=notifs();drawNotif(n,getSeen());p.classList.add('on');localStorage.setItem('autosupply-seen',JSON.stringify(n.map(x=>x.k)));$('#nb').textContent='';lastUn=0},
  bk:()=>{dl(`autosupply-backup-${d0(0)}.json`,JSON.stringify(S,null,2),'application/json');localStorage.setItem('autosupply-backup',Date.now());render();toast('Backup downloaded. Keep it safe.')},
  pickrs:()=>$('#rs').click(),
  csvi:()=>dl(`inventory-${d0(0)}.csv`,csv([['SKU','Item','Category','Brand','Qty','Cost','Price','Supplier','Expiry','Fits']].concat(S.items.map(i=>[i.sku,i.name,i.cat,i.brand,i.qty,i.cost,i.price,i.supplier,i.exp,i.note]))),'text/csv'),
  csvs:()=>dl(`sales-${RF}-to-${RT}.csv`,csv([['Date','Item','Qty','Sales','Cost','Profit','Status']].concat(salesIn().map(s=>[s.date,s.name,s.qty,s.amt,s.cost,s.amt-s.cost,s.st]))),'text/csv'),
  pinv:()=>printDoc('Inventory Report',invTbl()),
  psales:()=>printDoc(`Sales Report · ${RF} to ${RT}`,salesTbl(salesIn())),
  reset:()=>ask('Reset all data?','Everything (items, sales, events, trash) will be replaced with the demo data. Download a backup first if you need your data.','Reset everything',()=>{S=seed();save();render();toast('Reset to demo data')})
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){ACT[b.dataset.a]?.(b)}
  if(e.target.matches('[data-x]')||e.target.id=='modal')closeM();
  if(!e.target.closest('#notif,.bell')||e.target.closest('.nt'))$('#notif').classList.remove('on');
  const r=e.target.closest('.btn,.nv');
  if(r){const s=document.createElement('span'),k=r.getBoundingClientRect();s.className='rip';s.style.cssText=`width:60px;height:60px;left:${e.clientX-k.left-30}px;top:${e.clientY-k.top-30}px`;r.appendChild(s);setTimeout(()=>s.remove(),700)}
});
document.addEventListener('change',e=>{if(e.target.id=='fc'){F=e.target.value;render()}});
$('#q').addEventListener('input',e=>{Q=e.target.value;V=='inv'?render():go('inv')});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();$('#notif').classList.remove('on')}});

/* ---------- pro effects: glow cursor, 3D tilt, spotlight ---------- */
const glow=$('#glow');
document.addEventListener('mousemove',e=>{
  glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px';
  const c=e.target.closest?.('.card');if(!c)return;
  const k=c.getBoundingClientRect(),x=(e.clientX-k.left)/k.width,y=(e.clientY-k.top)/k.height;
  c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
  if(c.classList.contains('tilt'))c.style.transform=`perspective(900px) rotateX(${(.5-y)*7}deg) rotateY(${(x-.5)*9}deg) translateY(-4px)`;
});
document.addEventListener('mouseout',e=>{const c=e.target.closest?.('.tilt');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});
setInterval(()=>$('#clock').textContent='🕐 '+new Date().toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'}),1000);
$('#clock').textContent='🕐 '+new Date().toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'});
setInterval(()=>{const g=$('#greet');if(g)g.textContent=greet()+', Amelia!'},60000);
go('dash');setTimeout(()=>$('#splash').classList.add('off'),1300);
setTimeout(()=>{ready=true;announce()},1500);setInterval(announce,30000);

</script>
</body>
